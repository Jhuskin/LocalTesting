<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Test Page</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f2744 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 4.75rem 1rem 3rem;
      gap: 2rem;
    }

    /* ── Login card ───────────────────────────────── */
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem 2.25rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    /* ── Header ───────────────────────────────────── */
    .login-logo {
      width: 3rem;
      height: 3rem;
      background: #0f4c81;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin-bottom: 1.25rem;
    }

    .login-card h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.25rem;
    }

    .login-card .subtitle {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 2rem;
    }

    /* ── Fields ───────────────────────────────────── */
    .field-group {
      margin-bottom: 1.1rem;
    }

    .field-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #475569;
      margin-bottom: 0.4rem;
    }

    .field-group input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 2px solid #e2e8f0;
      border-radius: 9px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #0f172a;
      background: #f8fafc;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      outline: none;
    }

    .field-group input:focus {
      border-color: #0f4c81;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(15,76,129,0.1);
    }

    .field-group input.invalid {
      border-color: #dc2626;
      background: #fff5f5;
    }

    /* ── Password wrapper ─────────────────────────── */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      padding-right: 2.75rem;
    }

    .pw-toggle {
      position: absolute;
      right: 0.6rem;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.3rem;
      display: flex;
      align-items: center;
      color: #94a3b8;
      transition: color 0.15s;
    }

    .pw-toggle:hover { color: #475569; }

    /* Eye icon SVG drawn inline */

    /* ── Submit button ────────────────────────────── */
    .login-btn {
      width: 100%;
      padding: 0.78rem;
      margin-top: 0.5rem;
      background: #0f4c81;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .login-btn:hover:not(:disabled) { background: #0d3f6c; }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Spinner */
    .spinner {
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
      display: none;
    }

    .login-btn.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Output bar ───────────────────────────────── */
    .output-wrapper {
      width: 100%;
      max-width: 400px;
    }

    .output-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      margin-bottom: 0.4rem;
    }

    .output-bar {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.85rem 1.1rem;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.9rem;
      min-height: 3rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .output-bar::before {
      content: "▶";
      color: #4ade80;
      flex-shrink: 0;
    }

    #output-text { color: #7dd3fc; }
    #output-text.success { color: #4ade80; }
    #output-text.error   { color: #f87171; }
    #output-text.loading { color: #fbbf24; }
    /* ── Site navigation ──────────────────────────── */
    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
    }
    .site-nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 2.75rem;
      gap: 1rem;
    }
    .site-nav-logo {
      font-size: 0.82rem;
      font-weight: 700;
      color: #7dd3fc;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }
    .site-nav-links {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      flex-wrap: wrap;
    }
    .nav-link {
      padding: 0.28rem 0.65rem;
      font-size: 0.78rem;
      font-family: inherit;
      color: #94a3b8;
      text-decoration: none;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .nav-link:hover  { color: #e2e8f0; background: rgba(255,255,255,0.07); }
    .nav-link.active { color: #7dd3fc; background: rgba(125,211,252,0.12); font-weight: 600; }

  </style>
  <script type="text/javascript" src="https://js-cdn.dynatrace.com/jstag/147f84b2bdc/bf44827rpq/4f4ae6f803553cd6_complete.js" crossorigin="anonymous"></script>
</head>
<body>

  <nav class="site-nav" style="width:100%;align-self:flex-start">
    <div class="site-nav-inner">
      <span class="site-nav-logo">&#129514; Test Pages</span>
      <div class="site-nav-links">
        <a href="shadow-dom-test.html" class="nav-link">Shadow DOM</a>
        <a href="iframe-test.html" class="nav-link">Iframes</a>
        <a href="dynamic-selector-test.html" class="nav-link">Dynamic Selectors</a>
        <a href="date-picker-test.html" class="nav-link">Date Picker</a>
        <a href="login-test.html" class="nav-link active">Login</a>
      </div>
    </div>
  </nav>

  <div class="login-card">
    <div class="login-logo">🔐</div>
    <h1>Sign in</h1>
    <p class="subtitle">Enter your credentials to continue</p>

    <form id="login-form" novalidate>
      <div class="field-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username" />
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Toggle password visibility">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="login-btn">
        <span class="spinner"></span>
        <span id="btn-label">Log In</span>
      </button>
    </form>
  </div>

  <div class="output-wrapper">
    <div class="output-label">Last Interaction</div>
    <div class="output-bar">
      <span id="output-text">Waiting for interaction…</span>
    </div>
  </div>

  <script>
    var API_URL = 'https://dogapi.dog/api/v2/facts';

    var outputEl  = document.getElementById('output-text');
    var form      = document.getElementById('login-form');
    var loginBtn  = document.getElementById('login-btn');
    var btnLabel  = document.getElementById('btn-label');
    var userInput = document.getElementById('username');
    var passInput = document.getElementById('password');

    function setOutput(msg, type) {
      outputEl.textContent = msg;
      outputEl.className = type || '';
    }

    /* ── Password toggle ─────────────────────────── */
    document.getElementById('pw-toggle').addEventListener('click', function() {
      var isHidden = passInput.type === 'password';
      passInput.type = isHidden ? 'text' : 'password';

      // Swap between open-eye and crossed-eye SVG
      document.getElementById('eye-icon').innerHTML = isHidden
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>' +
          '<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>' +
          '<line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>' +
          '<circle cx="12" cy="12" r="3"/>';
    });

    /* ── Form submit ─────────────────────────────── */
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      var username = userInput.value.trim();
      var password = passInput.value;

      // Basic empty-field check
      if (!username || !password) {
        setOutput('Please fill in both fields.', 'error');
        if (!username) userInput.classList.add('invalid');
        if (!password) passInput.classList.add('invalid');
        return;
      }

      userInput.classList.remove('invalid');
      passInput.classList.remove('invalid');

      // Disable UI and show loading state
      loginBtn.disabled = true;
      loginBtn.classList.add('loading');
      btnLabel.textContent = 'Authenticating…';
      setOutput('Contacting authentication server…', 'loading');

      fetch(API_URL)
        .then(function(response) {
          if (!response.ok) throw new Error('Server returned ' + response.status);
          return response.json();
        })
        .then(function() {
          resolveLogin(username, password, null);
        })
        .catch(function(err) {
          resolveLogin(username, password, err);
        });
    });

    function resolveLogin(username, password, fetchError) {
      // Re-enable UI
      loginBtn.disabled = false;
      loginBtn.classList.remove('loading');
      btnLabel.textContent = 'Log In';

      var credentialsValid = (username === 'Dynatrace' && password === 'Password123');

      if (fetchError) {
        // API call failed — report accordingly but still reflect credential result
        if (credentialsValid) {
          setOutput('Login successful — Welcome, ' + username + '! (server degraded)', 'success');
        } else {
          setOutput('Login failed — Authentication service unreachable.', 'error');
        }
        return;
      }

      if (credentialsValid) {
        setOutput('Login successful — Welcome, ' + username + '!', 'success');
      } else {
        setOutput('Login failed — Invalid username or password.', 'error');
      }
    }

    // Clear invalid state on input
    userInput.addEventListener('input', function() { this.classList.remove('invalid'); });
    passInput.addEventListener('input', function() { this.classList.remove('invalid'); });
  </script>

</body>
</html>
