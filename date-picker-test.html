<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Date Picker Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding-top: 2.75rem;
    }

    /* ── Hero ──────────────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, #0f4c81 0%, #1565c0 55%, #1e88e5 100%);
      padding: 3rem 1rem 5.5rem;
      text-align: center;
      color: #fff;
    }

    .hero-plane {
      font-size: 2.2rem;
      display: inline-block;
      transform: rotate(-10deg);
      margin-bottom: 0.5rem;
    }

    .hero h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .hero p {
      font-size: 0.95rem;
      opacity: 0.75;
    }

    /* ── Page wrapper ──────────────────────────────── */
    .page-wrapper {
      max-width: 860px;
      margin: -3rem auto 0;
      padding: 0 1rem 3rem;
    }

    /* ── Booking card ──────────────────────────────── */
    .booking-card {
      background: #fff;
      border-radius: 16px;
      padding: 1.75rem 2rem 2rem;
      box-shadow: 0 8px 40px rgba(0,0,0,0.14);
    }

    /* ── Trip type tabs ───────────────────────────── */
    .trip-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }

    .trip-tab {
      padding: 0.38rem 1rem;
      border: 2px solid #d1d5db;
      background: #fff;
      border-radius: 20px;
      font-size: 0.83rem;
      font-family: inherit;
      cursor: pointer;
      color: #6b7280;
      transition: all 0.15s;
    }

    .trip-tab.active {
      border-color: #0f4c81;
      color: #0f4c81;
      background: #eff6ff;
      font-weight: 600;
    }

    /* ── Date row ─────────────────────────────────── */
    .date-row {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .date-group {
      flex: 1;
      min-width: 170px;
    }

    .date-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: #6b7280;
      margin-bottom: 0.45rem;
    }

    .date-input-box {
      display: flex;
      align-items: stretch;
      border: 2px solid #d1d5db;
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .date-input-box:focus-within { border-color: #0f4c81; box-shadow: 0 0 0 3px rgba(15,76,129,0.1); }
    .date-input-box.valid        { border-color: #059669; }
    .date-input-box.invalid      { border-color: #dc2626; }

    .date-input-box input {
      flex: 1;
      padding: 0.7rem 0.8rem;
      border: none;
      outline: none;
      font-size: 0.95rem;
      font-family: "Consolas", "Courier New", monospace;
      color: #1a1a2e;
      background: transparent;
      min-width: 0;
      letter-spacing: 0.04em;
    }

    .date-input-box input::placeholder { color: #b0b7c3; font-family: system-ui, sans-serif; letter-spacing: 0; }

    .cal-icon-btn {
      padding: 0 0.8rem;
      border: none;
      border-left: 1px solid #e5e7eb;
      background: transparent;
      cursor: pointer;
      color: #9ca3af;
      display: flex;
      align-items: center;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .cal-icon-btn:hover { background: #f3f4f6; color: #0f4c81; }

    /* ── Arrow divider ────────────────────────────── */
    .arrow-divider {
      font-size: 1.3rem;
      color: #9ca3af;
      padding-top: 1.45rem;
      flex-shrink: 0;
      user-select: none;
    }

    /* ── Search button ────────────────────────────── */
    .search-btn {
      padding: 0.72rem 2.25rem;
      margin-top: 1.45rem;
      background: #e8611a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .search-btn:hover { background: #c45416; }

    /* ── Calendar overlay ─────────────────────────── */
    .cal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fade-in 0.15s ease;
    }

    .cal-overlay.hidden { display: none; }

    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    /* ── Calendar modal ───────────────────────────── */
    .cal-modal {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.28);
      width: 316px;
      overflow: hidden;
      animation: pop-in 0.18s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes pop-in { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1rem 0.85rem;
      background: #0f4c81;
      color: #fff;
    }

    .cal-field-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.7;
      margin-bottom: 0.1rem;
    }

    .cal-month-year {
      font-size: 1rem;
      font-weight: 700;
    }

    .cal-nav-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      line-height: 1;
    }

    .cal-nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.18); }
    .cal-nav-btn:disabled { opacity: 0.25; cursor: default; }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 0.6rem 0.6rem 0.1rem;
    }

    .cal-weekdays span {
      text-align: center;
      font-size: 0.68rem;
      font-weight: 700;
      color: #9ca3af;
      text-transform: uppercase;
      padding: 0.2rem 0;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 0 0.6rem 0.75rem;
      gap: 1px;
    }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.84rem;
      border: none;
      background: none;
      border-radius: 50%;
      cursor: pointer;
      font-family: inherit;
      color: #1f2937;
      transition: background 0.1s, color 0.1s;
    }

    .cal-day:hover:not(.disabled):not(.empty):not(.selected) {
      background: #dbeafe;
      color: #0f4c81;
    }

    .cal-day.today {
      border: 2px solid #0f4c81;
      font-weight: 600;
      color: #0f4c81;
    }

    .cal-day.selected {
      background: #0f4c81;
      color: #fff;
      font-weight: 700;
    }

    .cal-day.selected.today { border-color: rgba(255,255,255,0.5); }

    .cal-day.disabled {
      color: #d1d5db;
      cursor: not-allowed;
    }

    .cal-day.empty { pointer-events: none; }

    /* ── Output bar ───────────────────────────────── */
    .output-wrapper { margin-top: 2rem; }

    .output-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
      margin-bottom: 0.4rem;
    }

    .output-bar {
      background: #1a1a2e;
      color: #7dd3fc;
      border-radius: 8px;
      padding: 0.85rem 1.25rem;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.95rem;
      min-height: 3rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .output-bar::before {
      content: "▶";
      color: #4ade80;
      flex-shrink: 0;
    }

    /* ── Validation message ──────────────────────── */
    .validation-msg {
      font-size: 0.74rem;
      color: #dc2626;
      margin-top: 0.3rem;
      min-height: 1rem;
      display: none;
    }

    .validation-msg.visible { display: block; }

    /* ── Per-field debug box ──────────────────────── */
    .date-debug {
      margin-top: 0.45rem;
      background: #1a1a2e;
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.76rem;
    }

    .debug-label { color: #475569; flex-shrink: 0; }
    .debug-sep   { color: #334155; flex-shrink: 0; }

    .debug-value {
      color: #7dd3fc;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .debug-status {
      flex-shrink: 0;
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 3px;
    }

    .debug-status.ok    { background: #052e16; color: #4ade80; }
    .debug-status.err   { background: #450a0a; color: #fca5a5; }
    .debug-status.empty { background: #1e293b; color: #64748b; }

    /* ── Responsive ───────────────────────────────── */
    @media (max-width: 600px) {
      .booking-card { padding: 1.25rem; }
      .arrow-divider { display: none; }
      .search-btn { width: 100%; justify-content: center; }
    }
    /* ── Site navigation ──────────────────────────── */
    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
    }
    .site-nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 2.75rem;
      gap: 1rem;
    }
    .site-nav-logo {
      font-size: 0.82rem;
      font-weight: 700;
      color: #7dd3fc;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }
    .site-nav-links {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      flex-wrap: wrap;
    }
    .nav-link {
      padding: 0.28rem 0.65rem;
      font-size: 0.78rem;
      font-family: inherit;
      color: #94a3b8;
      text-decoration: none;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;

    .nav-link:hover  { color: #e2e8f0; background: rgba(255,255,255,0.07); }
    .nav-link.active { color: #7dd3fc; background: rgba(125,211,252,0.12); font-weight: 600; }

  <script>
    var MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
    var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    /* ── Date constraints ─────────────────────────── */
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var maxDate = new Date(today);
    maxDate.setFullYear(maxDate.getFullYear() + 1);

    /* ── State ───────────────────────────────────────  */
    var depDate = null;
    var retDate = null;
    var activeField  = null;
    var calViewYear  = today.getFullYear();
    var calViewMonth = today.getMonth();

    // Guard: prevents our value setter from treating our own writes as external changes
    var internalSet = { dep: false, ret: false };

    /* ── Output ──────────────────────────────────────  */
    function setOutput(msg) {
      document.getElementById('output-text').textContent = msg;
    }

    /* ── Formatting / parsing ────────────────────────  */
    function formatDate(d) {
      return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
    }

    function formatDateLong(d) {
      return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()] + ' ' + d.getFullYear();
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function parseDate(str) {
      if (!str || str.length !== 10) return null;
      var parts = str.split('/');
      if (parts.length !== 3) return null;
      var d = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10) - 1;
      var y = parseInt(parts[2], 10);
      if (isNaN(d) || isNaN(m) || isNaN(y)) return null;
      var date = new Date(y, m, d);
      date.setHours(0, 0, 0, 0);
      if (date.getDate() !== d || date.getMonth() !== m || date.getFullYear() !== y) return null;
      return date;
    }

    function isSameDay(a, b) {
      return a.getFullYear() === b.getFullYear() &&
             a.getMonth()    === b.getMonth()    &&
             a.getDate()     === b.getDate();
    }

    /* ── Cross-validation ────────────────────────────  */
    function crossValidate(field, date) {
      if (field === 'dep' && retDate && date >= retDate)
        return 'Must be before return date (' + formatDate(retDate) + ')';
      if (field === 'ret' && depDate && date <= depDate)
        return 'Must be after departure date (' + formatDate(depDate) + ')';
      return null;
    }

    /* ── UI helpers ──────────────────────────────────  */
    function setValidationMsg(field, msg) {
      var el = document.getElementById(field + '-validation');
      el.textContent = msg || '';
      msg ? el.classList.add('visible') : el.classList.remove('visible');
    }

    function updateDebugBox(field) {
      var valEl  = document.getElementById(field + '-debug-val');
      var statEl = document.getElementById(field + '-debug-status');
      var date   = field === 'dep' ? depDate : retDate;
      var val    = document.getElementById(field + '-input').value;

      valEl.textContent = val || '—';
      statEl.className = 'debug-status';

      if (!val) {
        statEl.textContent = 'empty';
        statEl.classList.add('empty');
      } else if (date) {
        statEl.textContent = formatDateLong(date);
        statEl.classList.add('ok');
      } else {
        statEl.textContent = 'invalid';
        statEl.classList.add('err');
      }
    }

    // Write a value to an input without triggering the programmatic-change handler
    function setInputValue(field, val) {
      internalSet[field] = true;
      document.getElementById(field + '-input').value = val;
      internalSet[field] = false;
    }

    /* ── Programmatic change detection ──────────────
       Override the value setter on each input element.
       Any external assignment (el.value = '...') triggers
       onProgrammaticChange; our own writes are guarded by internalSet.
    ─────────────────────────────────────────────────  */
    function interceptInput(fieldKey) {
      var el    = document.getElementById(fieldKey + '-input');
      var proto = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
      var origGet = proto.get;
      var origSet = proto.set;

      Object.defineProperty(el, 'value', {
        get: function() { return origGet.call(this); },
        set: function(val) {
          origSet.call(this, val);
          if (!internalSet[fieldKey]) {
            onProgrammaticChange(fieldKey, val);
          }
        },
        configurable: true
      });
    }

    function onProgrammaticChange(field, val) {
      var box   = document.getElementById(field + '-box');
      var label = field === 'dep' ? 'Departure' : 'Return';

      if (!val) {
        if (field === 'dep') depDate = null; else retDate = null;
        box.classList.remove('valid', 'invalid');
        setValidationMsg(field, '');
        setOutput(label + ' — cleared programmatically');
        updateDebugBox(field);
        return;
      }

      var date = parseDate(val);

      if (!date || date < today || date > maxDate) {
        if (field === 'dep') depDate = null; else retDate = null;
        if (val.length === 10) {
          box.classList.add('invalid');
          box.classList.remove('valid');
          setValidationMsg(field, !date ? 'Invalid date format' : 'Date out of allowed range');
        } else {
          box.classList.remove('valid', 'invalid');
          setValidationMsg(field, '');
        }
        setOutput(label + ' — programmatic: "' + val + '" (invalid)');
        updateDebugBox(field);
        return;
      }

      var crossErr = crossValidate(field, date);
      if (crossErr) {
        if (field === 'dep') depDate = null; else retDate = null;
        box.classList.add('invalid');
        box.classList.remove('valid');
        setValidationMsg(field, crossErr);
        setOutput(label + ' — programmatic: "' + val + '" rejected — ' + crossErr);
      } else {
        if (field === 'dep') depDate = date; else retDate = date;
        box.classList.remove('invalid');
        box.classList.add('valid');
        setValidationMsg(field, '');
        setOutput(label + ' — set programmatically: ' + val);
      }
      updateDebugBox(field);
    }

    /* ── Input auto-formatting ───────────────────────  */
    function handleDateInput(e, field) {
      var input  = e.target;
      var digits = input.value.replace(/\D/g, '').slice(0, 8);

      var formatted;
      if (digits.length <= 2)      formatted = digits;
      else if (digits.length <= 4) formatted = digits.slice(0, 2) + '/' + digits.slice(2);
      else                         formatted = digits.slice(0, 2) + '/' + digits.slice(2, 4) + '/' + digits.slice(4);

      setInputValue(field, formatted);   // guarded write — won't re-trigger onProgrammaticChange

      var box = document.getElementById(field + '-box');

      if (formatted.length === 10) {
        var date = parseDate(formatted);
        if (!date || date < today || date > maxDate) {
          box.classList.add('invalid');
          box.classList.remove('valid');
          if (field === 'dep') depDate = null; else retDate = null;
          setValidationMsg(field, !date ? 'Invalid date' : 'Date must be within the next year');
        } else {
          var crossErr = crossValidate(field, date);
          if (crossErr) {
            box.classList.add('invalid');
            box.classList.remove('valid');
            if (field === 'dep') depDate = null; else retDate = null;
            setValidationMsg(field, crossErr);
            setOutput((field === 'dep' ? 'Departure' : 'Return') + ' — invalid: ' + crossErr);
          } else {
            box.classList.remove('invalid');
            box.classList.add('valid');
            if (field === 'dep') depDate = date; else retDate = date;
            setValidationMsg(field, '');
            setOutput((field === 'dep' ? 'Departure' : 'Return') + ' — typed: ' + formatted);
          }
        }
      } else {
        box.classList.remove('valid', 'invalid');
        if (field === 'dep') depDate = null; else retDate = null;
        setValidationMsg(field, '');
      }
      updateDebugBox(field);
    }

    document.getElementById('dep-input').addEventListener('input', function(e) { handleDateInput(e, 'dep'); });
    document.getElementById('ret-input').addEventListener('input', function(e) { handleDateInput(e, 'ret'); });

    /* ── Calendar open / close ─────────────────────── */
    function openCalendar(field) {
      activeField = field;
      document.getElementById('cal-field-label').textContent =
        field === 'dep' ? 'Departure' : 'Return';

      var selected = field === 'dep' ? depDate : retDate;
      if (selected) {
        calViewYear  = selected.getFullYear();
        calViewMonth = selected.getMonth();
      } else {
        calViewYear  = today.getFullYear();
        calViewMonth = today.getMonth();
      }

      renderCalendar();
      document.getElementById('cal-overlay').classList.remove('hidden');
    }

    function closeCalendar() {
      document.getElementById('cal-overlay').classList.add('hidden');
    }

    // Close when clicking the backdrop (not the modal itself)
    document.getElementById('cal-overlay').addEventListener('click', function(e) {
      if (e.target === this) closeCalendar();
    });

    // Close on Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeCalendar();
    });

    document.getElementById('dep-cal-btn').addEventListener('click', function() { openCalendar('dep'); });
    document.getElementById('ret-cal-btn').addEventListener('click', function() { openCalendar('ret'); });

    /* ── Calendar navigation ───────────────────────── */
    document.getElementById('prev-btn').addEventListener('click', function() { navMonth(-1); });
    document.getElementById('next-btn').addEventListener('click', function() { navMonth(1); });

    function navMonth(dir) {
      var m = calViewMonth + dir;
      var y = calViewYear;
      if (m < 0)  { m = 11; y--; }
      if (m > 11) { m = 0;  y++; }

      // Clamp within allowed range
      var target   = new Date(y, m, 1);
      var minMonth = new Date(today.getFullYear(),   today.getMonth(),   1);
      var maxMonth = new Date(maxDate.getFullYear(), maxDate.getMonth(), 1);
      if (target < minMonth || target > maxMonth) return;

      calViewMonth = m;
      calViewYear  = y;
      renderCalendar();
    }

    /* ── Calendar render ───────────────────────────── */
    function renderCalendar() {
      document.getElementById('cal-title').textContent =
        MONTHS[calViewMonth] + ' ' + calViewYear;

      // Nav button states
      var atMin = calViewYear === today.getFullYear()   && calViewMonth === today.getMonth();
      var atMax = calViewYear === maxDate.getFullYear() && calViewMonth === maxDate.getMonth();
      document.getElementById('prev-btn').disabled = atMin;
      document.getElementById('next-btn').disabled = atMax;

      var grid = document.getElementById('cal-grid');
      grid.innerHTML = '';

      var firstDOW   = new Date(calViewYear, calViewMonth, 1).getDay();
      var daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();
      var selected   = activeField === 'dep' ? depDate : retDate;

      // Leading empty cells
      for (var i = 0; i < firstDOW; i++) {
        var empty = document.createElement('div');
        empty.className = 'cal-day empty';
        grid.appendChild(empty);
      }

      // Day buttons
      for (var d = 1; d <= daysInMonth; d++) {
        var date = new Date(calViewYear, calViewMonth, d);
        date.setHours(0, 0, 0, 0);

        var btn = document.createElement('button');
        btn.className = 'cal-day';
        btn.textContent = d;

        var disabled = date < today || date > maxDate;
        var isToday    = isSameDay(date, today);
        var isSelected = selected && isSameDay(date, selected);

        if (disabled) {
          btn.classList.add('disabled');
          btn.disabled = true;
        } else {
          (function(capturedDate) {
            btn.addEventListener('click', function() { pickDate(capturedDate); });
          })(new Date(date));
        }

        if (isToday)    btn.classList.add('today');
        if (isSelected) btn.classList.add('selected');

        grid.appendChild(btn);
      }
    }

    /* ── Date selection ─────────────────────────────  */
    function pickDate(date) {
      var formatted = formatDate(date);
      var label = activeField === 'dep' ? 'Departure' : 'Return';

      var crossErr = crossValidate(activeField, date);
      if (crossErr) {
        setOutput(label + ' — calendar rejected: ' + crossErr);
        return;  // keep calendar open so user can pick a valid date
      }

      if (activeField === 'dep') {
        depDate = date;
        setInputValue('dep', formatted);
        document.getElementById('dep-box').classList.remove('invalid');
        document.getElementById('dep-box').classList.add('valid');
        setValidationMsg('dep', '');
      } else {
        retDate = date;
        setInputValue('ret', formatted);
        document.getElementById('ret-box').classList.remove('invalid');
        document.getElementById('ret-box').classList.add('valid');
        setValidationMsg('ret', '');
      }

      updateDebugBox(activeField);
      setOutput(label + ' — calendar selected: ' + formatted);
      closeCalendar();
    }

    /* ── Trip type tabs ──────────────────────────────  */
    document.querySelectorAll('.trip-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.trip-tab').forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        var isRound = tab.dataset.trip === 'round';
        document.getElementById('ret-group').style.display = isRound ? '' : 'none';
        document.getElementById('arrow').style.display     = isRound ? '' : 'none';
      });
    });

    /* ── Init ────────────────────────────────────────  */
    interceptInput('dep');
    interceptInput('ret');
    updateDebugBox('dep');
    updateDebugBox('ret');
  </script>

</body>
</html>
