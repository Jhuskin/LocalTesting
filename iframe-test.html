<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iframe Nesting Test Page</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
      padding: 4.75rem 1rem 3rem;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      color: #1a1a2e;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 2rem;
    }

    .sections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.6rem;
    }

    .card-title { font-size: 1rem; font-weight: 600; color: #1a1a2e; }

    .badge {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
    }

    .card iframe {
      width: 100%;
      height: 190px;
      border: none;
      display: block;
    }

    .output-wrapper {
      max-width: 960px;
      margin: 2rem auto 0;
    }

    .output-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
      margin-bottom: 0.4rem;
    }

    .output-bar {
      background: #1a1a2e;
      color: #7dd3fc;
      border-radius: 8px;
      padding: 0.85rem 1.25rem;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.95rem;
      min-height: 3rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .output-bar::before {
      content: "▶";
      color: #4ade80;
      flex-shrink: 0;
    }
    /* ── Site navigation ──────────────────────────── */
    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
    }
    .site-nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 2.75rem;
      gap: 1rem;
    }
    .site-nav-logo {
      font-size: 0.82rem;
      font-weight: 700;
      color: #7dd3fc;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }
    .site-nav-links {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      flex-wrap: wrap;
    }
    .nav-link {
      padding: 0.28rem 0.65rem;
      font-size: 0.78rem;
      font-family: inherit;
      color: #94a3b8;
      text-decoration: none;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .nav-link:hover  { color: #e2e8f0; background: rgba(255,255,255,0.07); }
    .nav-link.active { color: #7dd3fc; background: rgba(125,211,252,0.12); font-weight: 600; }

  </style>
  <script type="text/javascript" src="https://js-cdn.dynatrace.com/jstag/147f84b2bdc/bf44827rpq/4f4ae6f803553cd6_complete.js" crossorigin="anonymous"></script>
</head>
<body>

  <nav class="site-nav">
    <div class="site-nav-inner">
      <span class="site-nav-logo">&#129514; Test Pages</span>
      <div class="site-nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shadow-dom-test.html" class="nav-link">Shadow DOM</a>
        <a href="iframe-test.html" class="nav-link active">Iframes</a>

        <a href="date-picker-test.html" class="nav-link">Date Picker</a>
        <a href="login-test.html" class="nav-link">Login</a>
        <a href="trusted-events-test.html" class="nav-link">Trusted Events</a>
      </div>
    </div>

  <h1>Iframe Nesting Test Page</h1>
  <p class="subtitle">1-frame &nbsp;·&nbsp; 2-frame &nbsp;·&nbsp; 3-frame &nbsp;·&nbsp; nested iframes</p>

  <div class="sections-grid" id="grid"></div>

  <div class="output-wrapper">
    <div class="output-label">Last Interaction</div>
    <div class="output-bar">
      <span id="output-text">Waiting for interaction…</span>
    </div>
  </div>

  <script>
    const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

    const SECTIONS = [
      { label: 'Section 1', accent: '#3b82f6', badgeBg: '#eff6ff', depth: 1, tag: '1 frame'  },
      { label: 'Section 2', accent: '#7c3aed', badgeBg: '#f5f3ff', depth: 2, tag: '2 frames' },
      { label: 'Section 3', accent: '#dc2626', badgeBg: '#fef2f2', depth: 3, tag: '3 frames' },
      { label: 'Section 4', accent: '#ea580c', badgeBg: '#fff7ed', depth: 4, tag: '4 frames' },
      { label: 'Section 5', accent: '#059669', badgeBg: '#ecfdf5', depth: 5, tag: '5 frames' },
      { label: 'Section 6', accent: '#db2777', badgeBg: '#fdf2f8', depth: 6, tag: '6 frames' },
    ];

    /* ── Build cards ──────────────────────────────────────────── */
    const grid = document.getElementById('grid');
    SECTIONS.forEach(function(s, i) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="card-header" style="border-bottom:2px solid ' + s.accent + '">' +
          '<span class="card-title">' + s.label + '</span>' +
          '<span class="badge" style="background:' + s.badgeBg + ';color:' + s.accent + '">' + s.tag + '</span>' +
        '</div>' +
        '<iframe id="frame' + (i + 1) + '"></iframe>';
      grid.appendChild(card);
    });

    /* ── Output ───────────────────────────────────────────────── */
    function setOutput(msg) {
      document.getElementById('output-text').textContent = msg;
    }

    // Relay messages from any iframe depth up to this page
    window.addEventListener('message', function(e) {
      if (typeof e.data === 'string' && e.data.indexOf(' - ') !== -1) {
        setOutput(e.data);
      }
    });

    /* ── srcdoc builder ───────────────────────────────────────── */

    // Encode a string for safe use as an HTML attribute value
    function encAttr(str) {
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }

    // The innermost iframe document — holds the actual controls
    function innermostDoc(label, accent) {
      var opts = DAYS.map(function(d) {
        return '<option value="' + d + '">' + d + '</option>';
      }).join('');

      var script =
        'var L=' + JSON.stringify(label) + ',' +
        'inp=document.querySelector("input"),' +
        'btn=document.querySelector("button"),' +
        'sel=document.querySelector("select");' +
        'inp.addEventListener("input",function(){' +
          'window.parent.postMessage(L+" - Input value: "+inp.value,"*")' +
        '});' +
        'btn.addEventListener("click",function(){' +
          'window.parent.postMessage(L+" - Button clicked","*")' +
        '});' +
        'sel.addEventListener("change",function(){' +
          'if(sel.value)window.parent.postMessage(L+" - Dropdown selected: "+sel.value,"*")' +
        '});';

      return '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>' +
        '*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}' +
        'body{font-family:system-ui,sans-serif;padding:.75rem 1rem}' +
        '.controls{display:flex;flex-direction:column;gap:.65rem}' +
        'input[type=text]{padding:.5rem .7rem;border:2px solid #d1d5db;border-radius:6px;' +
          'font-size:.9rem;width:100%;font-family:inherit;transition:border-color .15s}' +
        'input[type=text]:focus{outline:none;border-color:' + accent + '}' +
        'button{padding:.5rem 1rem;background:' + accent + ';color:#fff;border:none;' +
          'border-radius:6px;font-size:.9rem;font-family:inherit;cursor:pointer;transition:filter .15s}' +
        'button:hover{filter:brightness(.88)}button:active{filter:brightness(.75)}' +
        'select{padding:.5rem .7rem;border:2px solid #d1d5db;border-radius:6px;font-size:.9rem;' +
          'font-family:inherit;width:100%;background:#fff;cursor:pointer;transition:border-color .15s}' +
        'select:focus{outline:none;border-color:' + accent + '}' +
        '</style></head><body>' +
        '<div class="controls">' +
          '<input type="text" placeholder="Type something..." />' +
          '<button>Click Me</button>' +
          '<select><option value="">-- Select a day --</option>' + opts + '</select>' +
        '</div>' +
        '<script>' + script + '<' + '/script>' +
        '</body></html>';
    }

    // A pass-through relay iframe — wraps an inner srcdoc and bubbles messages upward
    // encodedInner must already be HTML-attribute-encoded
    function relayDoc(encodedInner) {
      var relayScript =
        'window.addEventListener("message",function(e){window.parent.postMessage(e.data,"*")});';
      return '<!DOCTYPE html><html><body style="margin:0;padding:0;overflow:hidden">' +
        '<iframe srcdoc="' + encodedInner + '" style="width:100%;height:100%;border:none"></iframe>' +
        '<script>' + relayScript + '<' + '/script>' +
        '</body></html>';
    }

    // Build the full srcdoc chain inside-out for the requested depth
    function buildSrcdoc(label, accent, depth) {
      var doc = innermostDoc(label, accent);
      for (var i = 1; i < depth; i++) {
        doc = relayDoc(encAttr(doc));
      }
      return doc;
    }

    // Wire each card iframe
    SECTIONS.forEach(function(s, i) {
      document.getElementById('frame' + (i + 1)).srcdoc = buildSrcdoc(s.label, s.accent, s.depth);
    });
  </script>

</body>
</html>
