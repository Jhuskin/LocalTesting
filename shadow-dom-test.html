  <h1>Shadow DOM Test Page</h1>
  <p class="subtitle">1-layer &nbsp;&middot;&nbsp; 2-layer &nbsp;&middot;&nbsp; 3-layer nested shadow roots</p>

  <div class="sections-grid">
    <shadow-section-one></shadow-section-one>
    <shadow-section-two></shadow-section-two>
    <shadow-section-three></shadow-section-three>
    <shadow-section-four></shadow-section-four>
    <shadow-section-five></shadow-section-five>
    <shadow-section-six></shadow-section-six>
  </div>

  <div class="output-wrapper">
    <output-display></output-display>
  </div>

  <script>
    const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

    let outputTextEl = null;

    function setOutput(msg) {
      if (outputTextEl) outputTextEl.textContent = msg;
    }

    function controlStyles(accent) {
      return `
        <style>
          *, *::before, *::after { box-sizing: border-box; }
          .controls { display: flex; flex-direction: column; gap: 0.65rem; padding: 0.75rem 1rem; }
          input[type="text"] {
            padding: 0.5rem 0.7rem; border: 2px solid #d1d5db;
            border-radius: 6px; font-size: 0.9rem; width: 100%;
            font-family: inherit; transition: border-color 0.15s;
          }
          input[type="text"]:focus { outline: none; border-color: ${accent}; }
          button {
            padding: 0.5rem 1rem; background: ${accent}; color: #fff;
            border: none; border-radius: 6px; font-size: 0.9rem;
            font-family: inherit; cursor: pointer; transition: filter 0.15s;
          }
          button:hover  { filter: brightness(0.88); }
          button:active { filter: brightness(0.75); }
          select {
            padding: 0.5rem 0.7rem; border: 2px solid #d1d5db;
            border-radius: 6px; font-size: 0.9rem; font-family: inherit;
            width: 100%; background: #fff; cursor: pointer;
            transition: border-color 0.15s;
          }
          select:focus { outline: none; border-color: ${accent}; }
        </style>
      `;
    }

    function controlsHTML(accent) {
      return controlStyles(accent) + `
        <div class="controls">
          <input type="text" placeholder="Type something..." />
          <button>Click Me</button>
          <select>
            <option value="">-- Select a day --</option>
            ` + DAYS.map(d => `<option value="${d}">${d}</option>`).join('') + `
          </select>
        </div>
      `;
    }

    function attachEvents(root, label) {
      const input  = root.querySelector('input');
      const button = root.querySelector('button');
      const select = root.querySelector('select');

      input.addEventListener('input', () =>
        setOutput(label + ' - Input value: "' + input.value + '"'));

      button.addEventListener('click', () =>
        setOutput(label + ' - Button clicked'));

      select.addEventListener('change', () => {
        if (select.value) setOutput(label + ' - Dropdown selected: ' + select.value);
      });
    }

    /* Section 1: 1 shadow layer */
    class ShadowSectionOne extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML =
          '<style>' +
          ':host { display:block; background:#fff; border-radius:12px; padding:1.25rem; box-shadow:0 2px 12px rgba(0,0,0,.07); }' +
          '.card-header { display:flex; align-items:center; justify-content:center; gap:.5rem; margin-bottom:1rem; padding-bottom:.6rem; border-bottom:2px solid #3b82f6; }' +
          '.card-title { font-size:1rem; font-weight:600; color:#1a1a2e; }' +
          '.badge { font-size:.68rem; font-weight:600; background:#eff6ff; color:#3b82f6; padding:2px 7px; border-radius:20px; }' +
          '</style>' +
          '<div class="card-header"><span class="card-title">Section 1</span><span class="badge">1 layer</span></div>' +
          controlsHTML('#3b82f6');
        attachEvents(root, 'Section 1');
      }
    }
    customElements.define('shadow-section-one', ShadowSectionOne);

    /* Section 2: 2 shadow layers */
    class Sec2Inner extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML = controlsHTML('#7c3aed');
        attachEvents(root, 'Section 2');
      }
    }
    customElements.define('sec2-inner', Sec2Inner);

    class ShadowSectionTwo extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML =
          '<style>' +
          ':host { display:block; background:#fff; border-radius:12px; padding:1.25rem; box-shadow:0 2px 12px rgba(0,0,0,.07); }' +
          '.card-header { display:flex; align-items:center; justify-content:center; gap:.5rem; margin-bottom:1rem; padding-bottom:.6rem; border-bottom:2px solid #7c3aed; }' +
          '.card-title { font-size:1rem; font-weight:600; color:#1a1a2e; }' +
          '.badge { font-size:.68rem; font-weight:600; background:#f5f3ff; color:#7c3aed; padding:2px 7px; border-radius:20px; }' +
          '</style>' +
          '<div class="card-header"><span class="card-title">Section 2</span><span class="badge">2 layers</span></div>' +
          '<sec2-inner></sec2-inner>';
      }
    }
    customElements.define('shadow-section-two', ShadowSectionTwo);

    /* Section 3: 3 shadow layers */

      connectedCallback() {

    class Sec3Mid extends HTMLElement {

        const root = this.attachShadow({ mode: 'open' });

    }
    customElements.define('sec3-mid', Sec3Mid);

    class ShadowSectionThree extends HTMLElement {

          '<style>' +

    class Sec4Core extends HTMLElement {

    customElements.define('sec4-core', Sec4Core);

    class Sec4L3 extends HTMLElement {

        this.attachShadow({ mode: 'open' }).innerHTML = '<sec4-core></sec4-core>';

    customElements.define('sec4-l3', Sec4L3);

    class Sec4L2 extends HTMLElement {

          '<sec4-l2></sec4-l2>';

    }
    customElements.define('shadow-section-four', ShadowSectionFour);

    /* Section 5: 5 shadow layers */
    class Sec5Core extends HTMLElement {

        const root = this.attachShadow({ mode: 'open' });

    class Sec5L4 extends HTMLElement {
      connectedCallback() {
        this.attachShadow({ mode: 'open' }).innerHTML = '<sec5-core></sec5-core>';
      }
    }
    customElements.define('sec5-l4', Sec5L4);

    class Sec5L3 extends HTMLElement {
      connectedCallback() {
        this.attachShadow({ mode: 'open' }).innerHTML = '<sec5-l4></sec5-l4>';
      }
    }
    customElements.define('sec5-l3', Sec5L3);

    class Sec5L2 extends HTMLElement {
      connectedCallback() {
        this.attachShadow({ mode: 'open' }).innerHTML = '<sec5-l3></sec5-l3>';
      }
    }
    customElements.define('sec5-l2', Sec5L2);

    class ShadowSectionFive extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML =
          '<style>' +
          ':host { display:block; background:#fff; border-radius:12px; padding:1.25rem; box-shadow:0 2px 12px rgba(0,0,0,.07); }' +
          '.card-header { display:flex; align-items:center; justify-content:center; gap:.5rem; margin-bottom:1rem; padding-bottom:.6rem; border-bottom:2px solid #059669; }' +
          '.card-title { font-size:1rem; font-weight:600; color:#1a1a2e; }' +
          '.badge { font-size:.68rem; font-weight:600; background:#ecfdf5; color:#059669; padding:2px 7px; border-radius:20px; }' +

    }
    customElements.define('shadow-section-five', ShadowSectionFive);

    /* Section 6: 6 shadow layers */
    class Sec6Core extends HTMLElement {

        const root = this.attachShadow({ mode: 'open' });

      }
    }
    customElements.define('sec6-core', Sec6Core);

    class Sec6L5 extends HTMLElement {
      connectedCallback() {
        this.attachShadow({ mode: 'open' }).innerHTML = '<sec6-core></sec6-core>';
      }
    }
    customElements.define('sec6-l5', Sec6L5);

    class Sec6L4 extends HTMLElement {
      connectedCallback() {
        this.attachShadow({ mode: 'open' }).innerHTML = '<sec6-l5></sec6-l5>';
      }
    }
    customElements.define('sec6-l4', Sec6L4);

    class Sec6L3 extends HTMLElement {
      connectedCallback() {
        this.attachShadow({ mode: 'open' }).innerHTML = '<sec6-l4></sec6-l4>';

    customElements.define('sec6-l3', Sec6L3);

    class Sec6L2 extends HTMLElement {
      connectedCallback() {

      }
    }
    customElements.define('sec6-l2', Sec6L2);

    class ShadowSectionSix extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML =
          '<style>' +
          ':host { display:block; background:#fff; border-radius:12px; padding:1.25rem; box-shadow:0 2px 12px rgba(0,0,0,.07); }' +
          '.card-header { display:flex; align-items:center; justify-content:center; gap:.5rem; margin-bottom:1rem; padding-bottom:.6rem; border-bottom:2px solid #db2777; }' +
          '.card-title { font-size:1rem; font-weight:600; color:#1a1a2e; }' +
          '.badge { font-size:.68rem; font-weight:600; background:#fdf2f8; color:#db2777; padding:2px 7px; border-radius:20px; }' +
          '</style>' +
          '<div class="card-header"><span class="card-title">Section 6</span><span class="badge">6 layers</span></div>' +
          '<sec6-l2></sec6-l2>';
      }
    }
    customElements.define('shadow-section-six', ShadowSectionSix);

    /* Output bar: 1 shadow layer */
    class OutputDisplay extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML = `
          <style>
            .output-label {
              font-size: 0.72rem;
              text-transform: uppercase;
              letter-spacing: 0.08em;
              color: #999;
              margin-bottom: 0.4rem;
            }
            .output-bar {
              background: #1a1a2e;
              color: #7dd3fc;
              border-radius: 8px;
              padding: 0.85rem 1.25rem;
              font-family: "Consolas", "Courier New", monospace;
              font-size: 0.95rem;
              min-height: 3rem;
              display: flex;
              align-items: center;
              gap: 0.6rem;
            }
            .output-bar::before {
              content: "▶";
              color: #4ade80;
              flex-shrink: 0;
            }
          </style>
          <div class="output-label">Last Interaction</div>
          <div class="output-bar">
            <span id="output-text">Waiting for interaction…</span>
          </div>
        `;
        outputTextEl = root.getElementById('output-text');
      }
    }
    customElements.define('output-display', OutputDisplay);
  </script>
