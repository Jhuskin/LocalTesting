<head>

      font-family: system-ui, -apple-system, sans-serif;

      font-size: 0.85rem;
      color: #888;

    }

    .content {
      max-width: 640px;
      margin: 0 auto;

    #click_result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    #click_result[hidden] { display: none; }

    /* ── Site navigation ──────────────────────────── */
    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
    }
    .site-nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 2.75rem;
      gap: 1rem;
    }
    .site-nav-logo {
      font-size: 0.82rem;
      font-weight: 700;
      color: #7dd3fc;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }
    .site-nav-links {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      flex-wrap: wrap;
    }
    .nav-link {
      padding: 0.28rem 0.65rem;
      font-size: 0.78rem;
      font-family: inherit;
      color: #94a3b8;
      text-decoration: none;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .nav-link:hover  { color: #e2e8f0; background: rgba(255,255,255,0.07); }
    .nav-link.active { color: #7dd3fc; background: rgba(125,211,252,0.12); font-weight: 600; }

  <nav class="site-nav">
    <div class="site-nav-inner">
      <span class="site-nav-logo">&#129514; Test Pages</span>
      <div class="site-nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shadow-dom-test.html" class="nav-link">Shadow DOM</a>
        <a href="iframe-test.html" class="nav-link">Iframes</a>

      </div>
    </div>
  </nav>

  <h1>Special Character ID in Shadow DOM</h1>
  <p class="subtitle">1 shadow layer &nbsp;&middot;&nbsp; button ID contains periods</p>

  <div class="content">
    <!-- Shadow host: the button lives inside this element's open shadow root -->
    <div id="shadow_layer"></div>

    <div id="click_result" role="status" aria-live="polite" hidden>
      &#9989; Button was successfully clicked!
    </div>
  </div>

  <script>
    const host = document.getElementById('shadow_layer');
    const root = host.attachShadow({ mode: 'open' });

    root.innerHTML =
      '<style>' +
        '.card { background: #fff; border: 2px dashed #6366f1; border-radius: 10px; padding: 1.5rem; text-align: center; }' +
        'button { font: inherit; font-size: 0.95rem; font-weight: 600; padding: 0.6rem 1.4rem; border: none; border-radius: 6px; background: #6366f1; color: #fff; cursor: pointer; }' +
        'button:hover { background: #4f46e5; }' +
      '</style>' +
      '<div class="card">' +
        '<button id="clickable.button" type="button">Click Me</button>' +
      '</div>';

    const result = document.getElementById('click_result');
    let clicks = 0;

    root.getElementById('clickable.button').addEventListener('click', () => {
      clicks++;
      result.textContent = '✅ Button was successfully clicked!' + (clicks > 1 ? ' (' + clicks + ' times)' : '');
      result.hidden = false;
    });
  </script>

</body>
</html>
